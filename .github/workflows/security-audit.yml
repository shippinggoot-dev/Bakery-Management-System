name: Security audit

on:
  # Run weekly so newly-disclosed CVEs surface even when nobody pushes.
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  # And on every PR that touches package.json / lockfile so a vulnerable
  # transitive dependency can't slip in unnoticed.
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**/package.json"
      - "packages/**/package.json"
  workflow_dispatch:

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # Fail on high or critical advisories. Moderate and below are reported
      # but do not block the build.
      - name: pnpm audit
        run: pnpm audit --audit-level=high
